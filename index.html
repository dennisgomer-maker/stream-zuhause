<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Stream Zuhause</title>
<style>
/* Bewusst einfaches CSS (kein flex-gap, kein aspect-ratio), damit auch ältere VIDAA-Browser es darstellen */
html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#07080b; }
body { font-family: "Segoe UI", Roboto, Arial, sans-serif; color:#e9ecf1; }
#stage { position:absolute; left:0; top:0; width:1920px; height:1080px; overflow:hidden;
  transform-origin:0 0; -webkit-transform-origin:0 0;
  background: radial-gradient(ellipse at 20% 0%, #1a2233 0%, #0b0d12 55%, #07080b 100%); }

#header { position:absolute; left:96px; right:96px; top:48px; height:80px; }
#brand { position:absolute; left:0; top:0; font-size:44px; font-weight:600; letter-spacing:.5px; }
#brand span { color:#4f8cff; }
#clock { position:absolute; right:0; top:0; font-size:44px; font-weight:300; color:#cfd6e2; }
#date { position:absolute; right:0; top:54px; font-size:22px; color:#7d8799; }
.hbtn { position:absolute; top:10px; padding:0 22px; height:52px; line-height:52px; border-radius:12px;
  background:#1d2534; color:#e9ecf1; font-size:20px; text-decoration:none; outline:none; }
.hbtn:hover { background:#ffffff; color:#0b0d12; }

#viewport { position:absolute; left:0; right:0; top:160px; bottom:0; overflow:hidden; }
#rows { position:absolute; left:0; right:0; top:0;
  transition: transform .25s ease; -webkit-transition: -webkit-transform .25s ease; }

.row { position:relative; height:auto; margin-bottom:40px; }
.row h2 { margin:0 0 18px 96px; font-size:30px; font-weight:500; color:#c4cbd8; }
.row h2 small { font-size:20px; color:#6f7a8c; font-weight:400; margin-left:16px; }
.track-wrap { position:relative; overflow:hidden; padding:14px 0 18px 0; }
.track { position:relative; white-space:nowrap; padding-left:96px;
  transition: transform .2s ease; -webkit-transition: -webkit-transform .2s ease; }

.tile { display:inline-block; vertical-align:top; position:relative; margin-right:28px;
  border-radius:18px; text-decoration:none; color:inherit; outline:none;
  transition: transform .15s ease, box-shadow .15s ease;
  -webkit-transition: -webkit-transform .15s ease, box-shadow .15s ease; }
.tile.focus { transform:scale(1.08); -webkit-transform:scale(1.08);
  box-shadow: 0 0 0 5px #ffffff, 0 18px 40px rgba(0,0,0,.6); z-index:2; }

/* App-Kacheln */
.app { width:250px; height:150px; margin-bottom:36px; }
.app .logo { position:absolute; left:0; top:0; right:0; bottom:0; border-radius:18px;
  text-align:center; line-height:150px; font-size:34px; font-weight:700; letter-spacing:.5px; }
.app .lbl { position:absolute; left:0; right:0; top:162px; text-align:center; font-size:20px; color:#8e98aa; }
.app.focus .lbl { color:#fff; }

/* Medien-Karten (Serien/Filme) */
.card { width:300px; height:190px; background:#151a24; overflow:hidden; }
.card .poster { position:absolute; left:0; top:0; right:0; height:190px; }
.card .shade { position:absolute; left:0; right:0; bottom:0; height:120px;
  background: linear-gradient(to top, rgba(0,0,0,.92), rgba(0,0,0,0)); }
.card .t { position:absolute; left:18px; right:18px; bottom:42px; font-size:24px; font-weight:600;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card .s { position:absolute; left:18px; right:18px; bottom:14px; font-size:18px; color:#b7c0cf;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card .badge { position:absolute; right:12px; top:12px; padding:4px 10px; border-radius:8px;
  font-size:16px; font-weight:700; color:#fff; }
.card .new { position:absolute; left:12px; top:12px; padding:4px 10px; border-radius:8px;
  font-size:16px; font-weight:700; background:#4f8cff; color:#fff; }

/* Werkzeug-Kacheln */
.tool { width:300px; height:90px; background:#141922; border:1px solid #222a38; }
.tool .t { position:absolute; left:24px; top:18px; font-size:22px; font-weight:600; }
.tool .s { position:absolute; left:24px; top:52px; font-size:16px; color:#7d8799; }

/* Detail-Overlay */
#overlay { position:absolute; left:0; top:0; width:1920px; height:1080px; display:none;
  background:rgba(4,5,8,.88); z-index:20; }
#overlay .panel { position:absolute; left:360px; top:220px; width:1200px; min-height:520px;
  background:#121722; border-radius:24px; box-shadow:0 30px 80px rgba(0,0,0,.6); }
#ov-title { position:absolute; left:60px; top:50px; right:60px; font-size:48px; font-weight:600; }
#ov-meta { position:absolute; left:60px; top:120px; right:60px; font-size:24px; color:#8e98aa; }
#ov-text { position:absolute; left:60px; top:180px; right:60px; bottom:150px; overflow:hidden; word-wrap:break-word; font-size:26px; line-height:1.45; color:#cdd4df; }
#ov-actions { position:absolute; left:60px; bottom:50px; right:60px; white-space:nowrap; }
.btn { display:inline-block; margin-right:22px; padding:0 34px; height:72px; line-height:72px;
  border-radius:14px; background:#1d2534; text-decoration:none; outline:none; font-size:24px; font-weight:600; color:#e9ecf1; }
.btn.focus { background:#ffffff; color:#0b0d12; }
#ov-hint { position:absolute; right:60px; bottom:74px; font-size:18px; color:#6f7a8c; }

/* Diagnose */
#diag { position:absolute; left:0; top:0; width:1920px; height:1080px; display:none; z-index:30;
  background:#05060a; font-family: Consolas, monospace; }
#diag h1 { margin:50px 96px 10px; font-size:38px; font-family:"Segoe UI",Arial,sans-serif; }
#diag .hint { margin:0 96px 20px; font-size:20px; color:#7d8799; font-family:"Segoe UI",Arial,sans-serif; }
#diag-methods { margin:0 96px; white-space:nowrap; font-family:"Segoe UI",Arial,sans-serif; }
#diag-methods .btn { height:60px; line-height:60px; font-size:20px; padding:0 22px; margin-right:14px; }
#diag-methods .btn.cur { box-shadow: inset 0 0 0 3px #4f8cff; }
#diag-testapp { margin:14px 0 0; font-size:22px; font-family:"Segoe UI",Arial,sans-serif; color:#cfd6e2; }
#diag .col { position:absolute; top:300px; bottom:60px; width:820px; overflow:hidden; word-wrap:break-word;
  background:#0d1018; border-radius:16px; padding:24px; font-size:20px; line-height:1.5; }
#diag-keys { left:96px; }
#diag-api { left:980px; font-size:17px; line-height:1.35; }
#diag .ok { color:#5fd38d; } #diag .warn { color:#ffb347; }

/* Kleine Statuszeile (Toast) */
#toast { position:absolute; left:50%; bottom:50px; width:900px; margin-left:-450px; text-align:center;
  padding:18px 24px; border-radius:14px; background:#1d2534; font-size:22px; display:none; z-index:40; }
#keybadge { position:absolute; right:24px; bottom:18px; font-size:16px; color:#4a5466; z-index:5;
  font-family: Consolas, monospace; display:none; }
</style>
</head>
<body>
<div id="stage">
  <div id="header">
    <div id="brand">Stream <span>Zuhause</span></div>
    <div id="clock">--:--</div>
    <div id="date"></div>
    <a href="#" id="hbtn-install" class="hbtn" style="right:300px">App installieren (Taste 1)</a>
    <a href="#" id="hbtn-diag" class="hbtn" style="right:640px">Diagnose (Taste 0)</a>
  </div>
  <div id="viewport"><div id="rows"></div></div>

  <div id="overlay"><div class="panel">
    <div id="ov-title"></div><div id="ov-hint">Zurück = schließen</div>
    <div id="ov-meta"></div><div id="ov-text"></div>
    <div id="ov-actions"></div>
  </div></div>

  <div id="diag">
    <h1>Diagnose: Fernbedienung &amp; VIDAA-Schnittstellen</h1>
    <div class="hint">Links/Rechts: Startmethode · Hoch/Runter: Test-App · OK: testen &amp; als Standard speichern · Zurück (2×) oder „0“: schließen</div>
    <div id="diag-methods"></div>
    <div class="col" id="diag-keys"></div>
    <div class="col" id="diag-api"></div>
  </div>

  <div id="toast"></div>
  <div id="keybadge"></div>
</div>

<script>
/* =====================================================================
   STREAM ZUHAUSE – Konfiguration
   ===================================================================== */
var APPS = [
  { name:"Netflix",     id:"1",    version:"98", bg:"#000000", fg:"#e50914", text:"NETFLIX", web:"https://www.netflix.com/" },
  { name:"Prime Video", id:"2",    version:"98", bg:"#0f171e", fg:"#00a8e1", text:"prime video", web:"https://www.primevideo.com/" },
  { name:"RTL+",        id:"300",  version:"99", bg:"#ffffff", fg:"#111111", text:"RTL+", web:"https://plus.rtl.de/" },
  { name:"YouTube",     id:"3",    version:"98", bg:"#ffffff", fg:"#ff0000", text:"YouTube", web:"https://www.youtube.com/tv" },
  { name:"Joyn",        id:"1908", version:"99", bg:"#0c0c0c", fg:"#ffffff", text:"joyn", web:"https://www.joyn.de/" },
  { name:"ZDF",         id:"187",  version:"98", bg:"#fa7d19", fg:"#ffffff", text:"ZDF", web:"https://www.zdf.de/" }
];

/* Neue deutsche Filme kommen von TMDB (kostenloser API-Schlüssel, v3 „API Key“ von themoviedb.org).
   Alternativ einmalig per Adresse setzen: ...index.html?tmdb=DEIN_SCHLUESSEL (wird auf dem TV gespeichert). */
var TMDB_KEY = "";

/* Serienradar: TVmaze (frei, ohne Schlüssel). Zuordnung Sender/Plattform -> deine Dienste */
var SERVICE_MAP = {
  "Netflix":"Netflix", "Prime Video":"Prime Video", "Amazon Prime Video":"Prime Video",
  "RTL+":"RTL+", "RTL":"RTL+", "VOX":"RTL+", "RTLZWEI":"RTL+", "RTL 2":"RTL+", "RTL II":"RTL+", "RTL Zwei":"RTL+", "NITRO":"RTL+", "RTLup":"RTL+", "Super RTL":"RTL+", "SUPER RTL":"RTL+", "n-tv":"RTL+",
  "Joyn":"Joyn", "ProSieben":"Joyn", "SAT.1":"Joyn", "Sat.1":"Joyn", "kabel eins":"Joyn", "Kabel Eins":"Joyn", "sixx":"Joyn", "ProSieben MAXX":"Joyn", "SAT.1 Gold":"Joyn",
  "ZDFmediathek":"ZDF", "ZDF":"ZDF", "ZDFneo":"ZDF", "ZDFinfo":"ZDF", "3sat":"ZDF", "funk":"ZDF"
};
/* Unsere Serien – oben angepinnt, mit neuester und nächster Folge (tvmaze = Serien-ID bei TVmaze) */
var MEINE_SERIEN = [
  { title:"Temptation Island", app:"RTL+", tvmaze:[64535, 62354], heart:true },
  { title:"Das Duell um die Geld", app:"Joyn", tvmaze:[79813] },
  { title:"Der Promihof", app:"RTL+", tvmaze:[87638] },
  { title:"Experte für alles", app:"Joyn", tvmaze:[84357] },
  { title:"Die Helgoländer", app:"Joyn", info:"Staffel 1 · bei Joyn",
    text:"Doku-Serie: eine Saison lang mit den Menschen, die das Leben auf Helgoland am Laufen halten." }
];
var SERIEN_TAGE = 6;       // wie viele Tage zurück
var SERIEN_SPRACHEN = ["German", "English"]; // für Netflix/Prime (die liefern weltweit sehr viel)

/* =====================================================================
   App-Start (Priorität 2)
   Hier gehört der Aufruf hinein, mit dem Netflix bei dir bereits funktioniert hat.
   Gibt true zurück, wenn ein Start ausgelöst wurde.
   ===================================================================== */
/* Startmethoden. Welche auf deinem Modell funktioniert, testest du unter Einstellungen → Diagnose.
   Die gewählte Methode wird auf dem Fernseher gespeichert. */
var METHODS = [
  { key:"auto",    label:"Automatisch" },
  { key:"name",    label:"launchAppViaName", fn:"Hisense_launchAppViaName", arg:function (a) { return [a.name]; } },
  { key:"startid", label:"StartApp (App-ID)", fn:"Hisense_StartApp",        arg:function (a) { return [a.id]; } },
  { key:"startnm", label:"StartApp (Name)",   fn:"Hisense_StartApp",        arg:function (a) { return [a.name]; } },
  { key:"uri",     label:"launchAppViaUri",   fn:"Hisense_launchAppViaUri", arg:function (a) { return [a.web]; } },
  { key:"web",     label:"Nur Webseite" }
];
function getMethod() { try { return localStorage.getItem("sz_method") || "auto"; } catch (e) { return "auto"; } }
function setMethod(k) { try { localStorage.setItem("sz_method", k); } catch (e) {} }

function callMethod(m, app) {
  var fn = m.fn && window[m.fn];
  if (typeof fn !== "function") return false;
  try { fn.apply(window, m.arg(app)); log("Start: " + m.fn + "(" + m.arg(app).join(", ") + ")"); return true; }
  catch (e) { log(m.fn + " Fehler: " + e.message); return false; }
}
function launchNative(app, forceKey) {
  var k = forceKey || getMethod();
  if (k === "web") return false;
  for (var i = 0; i < METHODS.length; i++) {
    if (k === "auto" ? METHODS[i].fn : METHODS[i].key === k) {
      if (callMethod(METHODS[i], app)) return true;
      if (k !== "auto") return false;
    }
  }
  return false;
}

function launchApp(app, forceKey) {
  toast(app.name + " wird geöffnet …");
  saveState();
  if (launchNative(app, forceKey)) return;
  // Keine Weiterleitung auf die Webseite – die ist auf dem TV unbrauchbar
  if (getMethod() === "web") { setTimeout(function () { window.location.href = app.web; }, 400); return; }
  toast(app.name + ": Direktstart der installierten App ist noch nicht eingerichtet");
}

/* =====================================================================
   Tastencodes – mehrere Varianten, weil VIDAA-Modelle unterschiedlich senden
   ===================================================================== */
var KEY = {
  LEFT:  [37, 21, 65361, "ArrowLeft", "Left"],
  UP:    [38, 19, 65362, "ArrowUp", "Up"],
  RIGHT: [39, 22, 65363, "ArrowRight", "Right"],
  DOWN:  [40, 20, 65364, "ArrowDown", "Down"],
  OK:    [13, 23, 66, 65293, "Enter", "Accept", "Select"],
  BACK:  [8, 27, 461, 10009, 166, "Backspace", "Escape", "Back", "GoBack", "BrowserBack"],
  DIAG:  [48, 96, 406, "0", "ColorF3Blue"],
  INST:  [49, 97, "1"],
  DOWN5: [50, 98, "2"]
};
function keyAction(e) {
  var c = e.keyCode || e.which || 0, k = e.key || "", n;
  for (n in KEY) {
    var list = KEY[n];
    for (var i = 0; i < list.length; i++) {
      if ((typeof list[i] === "number" && list[i] === c) || (typeof list[i] === "string" && list[i] === k)) return n;
    }
  }
  return null;
}

/* =====================================================================
   Aufbau der Oberfläche
   ===================================================================== */
var rows = [];        // [{el, track, items:[el...], col:0, kind}]
var rowIdx = 0;
var mode = "home";    // home | overlay | diag
var ovButtons = [], ovIdx = 0;

function appByName(n) { for (var i = 0; i < APPS.length; i++) if (APPS[i].name === n) return APPS[i]; return APPS[0]; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }

function makeRow(title, sub, kind) {
  var r = document.createElement("div"); r.className = "row";
  r.innerHTML = "<h2>" + esc(title) + (sub ? "<small>" + esc(sub) + "</small>" : "") + "</h2>" +
                "<div class='track-wrap'><div class='track'></div></div>";
  document.getElementById("rows").appendChild(r);
  var row = { el:r, track:r.querySelector(".track"), items:[], col:0, kind:kind, offset:0 };
  rows.push(row);
  return row;
}
function addItem(row, html, cls, onOk) {
  var a = document.createElement("a");
  a.href = "#"; a.className = "tile " + cls; a.setAttribute("tabindex", "-1");
  a.innerHTML = html;
  a._ok = onOk;
  // Klick (z. B. Maus/Zeiger-Modus) ebenfalls unterstützen
  a.onclick = function (ev) { ev.preventDefault(); var ri = rows.indexOf(row), ci = row.items.indexOf(a);
    rowIdx = ri; row.col = ci; render(); onOk(); return false; };
  // Zeigermodus des TV-Browsers: Hinzeigen markiert die Kachel
  a.onmouseover = function () { var ri = rows.indexOf(row), ci = row.items.indexOf(a);
    if (mode === "home" && (ri !== rowIdx || ci !== row.col)) { rowIdx = ri; row.col = ci; markFocus(); scrollRowIntoView(); } };
  row.track.appendChild(a);
  row.items.push(a);
}
function scrollRowIntoView() {
  var row = rows[rowIdx], rowsEl = document.getElementById("rows"), vh = 1080 - 160 - 40;
  var top = row.el.offsetTop, h = row.el.offsetHeight, cur = rowsEl._y || 0;
  if (top + h + cur > vh) cur = vh - top - h;
  if (top + cur < 0) cur = -top;
  if (rowIdx === 0) cur = 0;
  // nächste Reihe anteilig mit einblenden, damit man mit dem Zeiger weiter nach unten kommt
  if (rowIdx < rows.length - 1 && top + h + cur > vh - 160) cur = Math.max(vh - top - h - 160, -top);
  rowsEl._y = cur; setY(rowsEl, cur);
}
function markFocus() {
  for (var r = 0; r < rows.length; r++) for (var i = 0; i < rows[r].items.length; i++)
    rows[r].items[i].className = rows[r].items[i].className.replace(/\s?focus/g, "");
  rows[rowIdx].items[rows[rowIdx].col].className += " focus";
}

function mediaCard(item) {
  if (item.placeholder) return "<div class='poster' style='background:#151a24'></div><div class='t' style='white-space:normal;bottom:60px'>" +
    esc(item.title) + "</div><div class='s' style='white-space:normal'>" + esc(item.info) + "</div>";
  var app = appByName(item.app);
  var hue = 0; for (var i = 0; i < item.title.length; i++) hue = (hue * 31 + item.title.charCodeAt(i)) % 360;
  var bg = "linear-gradient(135deg,hsl(" + hue + ",45%,28%),hsl(" + ((hue + 60) % 360) + ",50%,14%))";
  if (item.img) bg = "url(\"" + item.img + "\") center 25% / cover no-repeat, " + bg;
  return "<div class='poster' style='background:" + bg + "'></div>" +
         "<div class='shade'></div>" +
         (item.isNew ? "<div class='new'>NEU</div>" : "") +
         "<div class='badge' style='background:" + app.bg + ";color:" + app.fg + "'>" + esc(app.name) + "</div>" +
         "<div class='t'>" + esc(item.title) + "</div><div class='s'>" + esc(item.info) + "</div>";
}

function build() {
  var r1 = makeRow("Apps", "", "apps");
  APPS.forEach(function (app) {
    addItem(r1, "<div class='logo' style='background:" + app.bg + ";color:" + app.fg + "'>" + esc(app.text) + "</div>" +
                "<div class='lbl'>" + esc(app.name) + "</div>", "app", function () { launchApp(app); });
  });
  var r0 = makeRow("Unsere Serien", "neueste und nächste Folge", "media");
  fillMedia(r0, MEINE_SERIEN.map(function (m) { return { placeholder:true, title:m.title, info:"lädt …" }; }));
  ROW_MEINE = r0;
  var r2 = makeRow("Serienradar", "neue Folgen der letzten Tage aus deinen Diensten", "media");
  fillMedia(r2, [{ placeholder:true, title:"Lädt …", info:"neue Folgen werden gesucht" }]);
  var r3 = makeRow("Neue deutsche Filme", "jetzt im Abo verfügbar", "media");
  fillMedia(r3, [{ placeholder:true, title:"Lädt …", info:"Filme werden gesucht" }]);
  ROW_SERIEN = r2; ROW_FILME = r3;
  var r4 = makeRow("Einstellungen", "", "tools");
  addItem(r4, "<div class='t'>Diagnose</div><div class='s'>Tastentest &amp; VIDAA-Schnittstellen</div>", "tool", openDiag);
  addItem(r4, "<div class='t'>Neu laden</div><div class='s'>Daten &amp; Oberfläche aktualisieren</div>", "tool", function () {
    try { localStorage.removeItem("sz_serien"); localStorage.removeItem("sz_filme"); localStorage.removeItem("sz_meine"); } catch (e) {} location.reload(); });
  addItem(r4, "<div class='t'>Als App installieren</div><div class='s'>eigene Kachel im TV-Startmenü</div>", "tool", installTile);
  addItem(r4, "<div class='t'>Installation rückgängig</div><div class='s'>App-Liste wiederherstellen</div>", "tool", restoreTile);
  addItem(r4, "<div class='t'>Tasten-Anzeige</div><div class='s'>letzte Taste unten rechts ein/aus</div>", "tool", function () {
    var b = document.getElementById("keybadge"); b.style.display = b.style.display === "block" ? "none" : "block"; });
}

/* =====================================================================
   Fokus & Scrollen (ohne native Scroll-Container – die schlucken Links/Rechts)
   ===================================================================== */
function render() {
  for (var r = 0; r < rows.length; r++) {
    for (var i = 0; i < rows[r].items.length; i++) rows[r].items[i].className = rows[r].items[i].className.replace(/\s?focus/g, "");
  }
  var row = rows[rowIdx], el = row.items[row.col];
  el.className += " focus";
  try { el.focus(); } catch (e) {}

  // horizontal: Kachel im sichtbaren Bereich halten
  var left = el.offsetLeft - 96, w = el.offsetWidth, view = 1920 - 96 * 2;
  if (left - row.offset + w > view) row.offset = left + w - view + 40;
  if (left < row.offset) row.offset = Math.max(0, left - 40);
  if (row.col === 0) row.offset = 0;
  setX(row.track, -row.offset);

  // vertikal: aktive Reihe sichtbar halten
  var top = row.el.offsetTop, vh = 1080 - 160 - 40, rowsEl = document.getElementById("rows");
  var cur = rowsEl._y || 0, h = row.el.offsetHeight;
  if (top + h + cur > vh) cur = vh - top - h;
  if (top + cur < 0) cur = -top;
  if (rowIdx === 0) cur = 0;
  rowsEl._y = cur; setY(rowsEl, cur);
}
function setX(el, x) { el.style.transform = el.style.webkitTransform = "translate3d(" + x + "px,0,0)"; }
function setY(el, y) { el.style.transform = el.style.webkitTransform = "translate3d(0," + y + "px,0)"; }

function move(dir) {
  var row = rows[rowIdx];
  if (dir === "LEFT"  && row.col > 0) row.col--;
  else if (dir === "RIGHT" && row.col < row.items.length - 1) row.col++;
  else if (dir === "UP" || dir === "DOWN") {
    var next = rowIdx + (dir === "UP" ? -1 : 1);
    if (next < 0 || next >= rows.length) return;
    // Spalte mit der nächstgelegenen Bildschirmposition wählen
    var cx = centerX(row.items[row.col], row);
    var nr = rows[next], best = 0, bd = 1e9;
    for (var i = 0; i < nr.items.length; i++) {
      var d = Math.abs(centerX(nr.items[i], nr) - cx);
      if (d < bd) { bd = d; best = i; }
    }
    rowIdx = next; nr.col = best;
  }
  render();
}
function centerX(el, row) { return el.offsetLeft - row.offset + el.offsetWidth / 2; }

/* =====================================================================
   Daten: Serienradar (TVmaze) & neue deutsche Filme (TMDB)
   ===================================================================== */
var ROW_SERIEN, ROW_FILME, ROW_MEINE;

function wday(iso) { var d = new Date(iso + "T12:00:00"); return ["So","Mo","Di","Mi","Do","Fr","Sa"][d.getDay()] + " " + deDate(iso); }
function loadMeine() {
  var cached = cacheGet("sz_meine", 120);
  if (cached) return fillMedia(ROW_MEINE, cached);
  var out = [], pending = 0, today = isoDay(0);
  MEINE_SERIEN.forEach(function (m, idx) {
    var base = { idx: idx, title: m.title, app: m.app, heart: m.heart, info: m.info || "", text: m.text || "", best: "" };
    out.push(base);
    (m.tvmaze || []).forEach(function (id) {
      pending++;
      getJSON("https://api.tvmaze.com/shows/" + id + "?embed[]=previousepisode&embed[]=nextepisode", function (s) {
        if (s) {
          var e = s._embedded || {}, p = e.previousepisode, n = e.nextepisode;
          var last = p ? p.airdate : "";
          if (last >= base.best) {   // bei mehreren IDs (z. B. Temptation Island & V.I.P.) die aktuellste nehmen
            base.best = last; base.title = s.name;
            base.img = s.image && (s.image.original || s.image.medium);
            base.text = stripHtml(s.summary) || base.text || "Keine Beschreibung vorhanden.";
            base.isNew = !!p && p.airdate >= isoDay(3);
            var parts = [];
            if (p) parts.push((p.airdate === today ? "neu heute" : "zuletzt " + deDate(p.airdate)) + " (S" + p.season + "E" + p.number + ")");
            if (n) parts.push("nächste: " + (n.airdate === today ? "heute" : wday(n.airdate)));
            base.info = parts.join(" · ") || "keine Termine";
          }
        }
        if (--pending === 0) done();
      });
    });
  });
  if (!pending) done();
  function done() {
    out.forEach(function (o) { if (o.heart) o.title = "♥ " + o.title; if (!o.text) o.text = "Keine Beschreibung vorhanden."; });
    cacheSet("sz_meine", out); fillMedia(ROW_MEINE, out);
  }
}

function fillMedia(row, list) {
  var wasHere = rows[rowIdx] === row;
  row.track.innerHTML = ""; row.items = []; row.offset = 0;
  list.forEach(function (it) { addItem(row, mediaCard(it), "card", function () { if (!it.placeholder) openDetail(it); }); });
  row.col = Math.min(row.col, row.items.length - 1);
  if (wasHere || mode === "home") render();
}

function getJSON(url, cb) {
  var x = new XMLHttpRequest();
  x.open("GET", url, true); x.timeout = 15000;
  x.onreadystatechange = function () {
    if (x.readyState !== 4) return;
    var d = null; try { if (x.status === 200) d = JSON.parse(x.responseText); } catch (e) {}
    cb(d);
  };
  x.ontimeout = function () { cb(null); };
  x.send();
}
function cacheGet(k, maxAgeMin) { try { var c = JSON.parse(localStorage.getItem(k) || "null");
  if (c && Date.now() - c.t < maxAgeMin * 60000) return c.d; } catch (e) {} return null; }
function cacheSet(k, d) { try { localStorage.setItem(k, JSON.stringify({ t: Date.now(), d: d })); } catch (e) {} }
function isoDay(offset) { var d = new Date(Date.now() - offset * 86400000);
  return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
function deDate(iso) { var p = (iso || "").split("-"); if (p.length !== 3) return "";
  return (+p[2]) + "." + (+p[1]) + "." + (+p[0] !== new Date().getFullYear() ? p[0] : ""); }
function stripHtml(s) { return String(s || "").replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim(); }

function loadSerien() {
  var cached = cacheGet("sz_serien", 180);
  if (cached) return fillMedia(ROW_SERIEN, cached);
  var urls = [];
  for (var i = 0; i < SERIEN_TAGE; i++) {
    var d = isoDay(i);
    urls.push("https://api.tvmaze.com/schedule/web?date=" + d);              // Netflix, Prime (weltweit)
    urls.push("https://api.tvmaze.com/schedule/web?date=" + d + "&country=DE"); // Joyn, ZDFmediathek, RTL+
    urls.push("https://api.tvmaze.com/schedule?date=" + d + "&country=DE");     // RTL, ProSieben, ZDF …
  }
  var pending = urls.length, shows = {};
  // nacheinander abrufen (TVmaze erlaubt nur ~20 Anfragen pro 10 s)
  var qi = 0;
  function next() { if (qi < urls.length) { var u = urls[qi++]; getJSON(u, handle(u)); } }
  next();
  function handle(u) { var tries = 0; return function cb(data) {
      if (data === null && tries++ < 2) { setTimeout(function () { getJSON(u, cb); }, 2500); return; }
      setTimeout(next, 250);
      (data || []).forEach(function (ep) {
        var s = ep.show || (ep._embedded && ep._embedded.show); if (!s) return;
        var ch = (s.webChannel && s.webChannel.name) || (s.network && s.network.name) || "";
        var app = SERVICE_MAP[ch]; if (!app) return;
        if (/^(News|Talk Show|Sports|Game Show|Panel Show)$/.test(s.type || "")) return;
        // Netflix/Prime liefern weltweit sehr viel: andere Sprachen nur, wenn die Serie bekannter ist
        if ((app === "Netflix" || app === "Prime Video") && SERIEN_SPRACHEN.indexOf(s.language) < 0 && (s.weight || 0) < 70) return;
        var g = shows[s.id];
        if (!g) g = shows[s.id] = { title: s.name, app: app, img: s.image && (s.image.original || s.image.medium),
          text: stripHtml(s.summary), weight: s.weight || 0, eps: {}, last: "", season: ep.season, lang: s.language };
        g.eps[ep.id] = true;
        var day = ep.airdate || (ep.airstamp || "").slice(0, 10);
        if (day > g.last) { g.last = day; g.season = ep.season; }
      });
      if (--pending === 0) {
        var list = [], today = isoDay(0), recent = isoDay(2);
        for (var id in shows) {
          var g = shows[id], n = 0; for (var k in g.eps) n++;
          list.push({ title: g.title, app: g.app, img: g.img, text: g.text || "Keine Beschreibung vorhanden.",
            isNew: g.last >= recent, last: g.last, weight: g.weight,
            info: (g.season > 100 ? "" : "Staffel " + g.season + " · ") + (n > 1 ? n + " neue Folgen" : "neue Folge") + " · " + (g.last === today ? "heute" : deDate(g.last)) });
        }
        list.sort(function (a, b) { return a.last === b.last ? b.weight - a.weight : (a.last < b.last ? 1 : -1); });
        list = list.slice(0, 24);
        if (!list.length) list = [{ placeholder:true, title:"Keine Daten", info:"Internet prüfen · später erneut versuchen" }];
        else cacheSet("sz_serien", list);
        fillMedia(ROW_SERIEN, list);
      }
  }; }
}

/* TMDB-Anbieternamen -> deine Dienste */
function tmdbApp(name) {
  if (/netflix/i.test(name)) return "Netflix";
  if (/amazon prime/i.test(name)) return "Prime Video";
  if (/rtl/i.test(name)) return "RTL+";
  if (/joyn/i.test(name)) return "Joyn";
  if (/zdf/i.test(name)) return "ZDF";
  if (/youtube/i.test(name)) return "YouTube";
  return null;
}
function loadFilme() {
  var key = TMDB_KEY;
  try { var m = /[?&]tmdb=([^&]+)/.exec(location.search); if (m) localStorage.setItem("sz_tmdb", m[1]); key = key || localStorage.getItem("sz_tmdb") || ""; } catch (e) {}
  if (!key) return fillMedia(ROW_FILME, [{ placeholder:true, title:"TMDB-Schlüssel fehlt", info:"wird einmalig eingerichtet" }]);
  var cached = cacheGet("sz_filme", 720);
  if (cached) return fillMedia(ROW_FILME, cached);
  var base = "https://api.themoviedb.org/3/", k = "api_key=" + key + "&language=de-DE";
  var url = base + "discover/movie?" + k + "&region=DE&watch_region=DE&with_origin_country=DE" +
    "&with_watch_monetization_types=flatrate&sort_by=primary_release_date.desc" +
    "&primary_release_date.gte=" + isoDay(540) + "&primary_release_date.lte=" + isoDay(0);
  getJSON(url, function (d) {
    var res = (d && d.results || []).slice(0, 30), pending = res.length, out = [];
    if (!pending) return fillMedia(ROW_FILME, [{ placeholder:true, title:"Keine Filme gefunden", info:"Schlüssel oder Internet prüfen" }]);
    res.forEach(function (f, idx) {
      getJSON(base + "movie/" + f.id + "/watch/providers?api_key=" + key, function (p) {
        var fl = (p && p.results && p.results.DE && p.results.DE.flatrate) || [], app = null, names = [];
        for (var i = 0; i < fl.length; i++) { var a = tmdbApp(fl[i].provider_name); if (a && names.indexOf(a) < 0) names.push(a); }
        app = names[0];
        if (app) out.push({ idx: idx, title: f.title, app: app, isNew: f.release_date >= isoDay(60),
          img: f.backdrop_path ? "https://image.tmdb.org/t/p/w780" + f.backdrop_path : (f.poster_path ? "https://image.tmdb.org/t/p/w500" + f.poster_path : null),
          info: (f.release_date || "").slice(0, 4) + " · " + names.join(", "),
          text: f.overview || "Keine Beschreibung vorhanden." });
        if (--pending === 0) {
          out.sort(function (a, b) { return a.idx - b.idx; });
          if (!out.length) out = [{ placeholder:true, title:"Nichts Neues", info:"bei deinen Diensten gerade keine neuen deutschen Filme" }];
          else cacheSet("sz_filme", out);
          fillMedia(ROW_FILME, out);
        }
      });
    });
  });
}

/* =====================================================================
   Als App installieren: trägt Stream Zuhause in die App-Liste des TVs ein
   (websdk/Appinfo.json über HiUtils_createRequest). Vorher wird eine Sicherung angelegt.
   ===================================================================== */
var APPINFO = "websdk/Appinfo.json";
var MY_URL = location.href.split("?")[0].split("#")[0];
function hiu(api, args) {
  var r = window.HiUtils_createRequest(api, args);
  if (typeof r === "string") { try { r = JSON.parse(r); } catch (e) {} }
  return r;
}
function hiuText(r) {   // Dateiinhalt aus der Antwort holen, egal wie verpackt
  if (typeof r === "string") return r;
  if (!r) return "";
  var keys = ["data", "result", "content", "value", "msg", "readdata"];
  for (var i = 0; i < keys.length; i++) {
    var v = r[keys[i]];
    if (typeof v === "string" && /[\[{]/.test(v)) return v;
    if (v && typeof v === "object") return JSON.stringify(v);
  }
  return "";
}
function findList(obj) {   // das Array mit den App-Einträgen finden
  if (Object.prototype.toString.call(obj) === "[object Array]") return { list: obj, set: null };
  for (var k in obj) if (Object.prototype.toString.call(obj[k]) === "[object Array]") return { list: obj[k], key: k };
  return null;
}
function info(title, text) {
  openDetail({ title: title, info: "", text: text, app: "Netflix", noLaunch: true });
}
function installTile() {
  if (typeof window.HiUtils_createRequest !== "function") return info("Installation nicht möglich", "Dieser Fernseher stellt HiUtils_createRequest nicht bereit.");
  var raw, txt, data, found;
  try { raw = hiu("fileRead", { path: APPINFO, mode: 6 }); } catch (e) { return info("Lesen fehlgeschlagen", e.message); }
  txt = hiuText(raw);
  try { data = JSON.parse(txt); } catch (e) { return info("App-Liste nicht lesbar", "Antwort des TVs: " + String(JSON.stringify(raw)).slice(0, 600)); }
  found = findList(data);
  if (!found || !found.list.length) return info("App-Liste unbekanntes Format", String(txt).slice(0, 600));
  var list = found.list, tpl = list[list.length - 1];
  for (var i = 0; i < list.length; i++) {
    var j = JSON.stringify(list[i]);
    if (j.indexOf(MY_URL) >= 0 || /stream zuhause/i.test(j)) return info("Schon installiert", "Stream Zuhause steht bereits in der App-Liste. Ggf. den Fernseher einmal neu starten.");
  }
  try { localStorage.setItem("sz_appinfo_backup", txt); } catch (e) {}
  var entry = JSON.parse(JSON.stringify(tpl));
  for (var k in entry) {
    var lk = k.toLowerCase(), v = entry[k];
    if (typeof v !== "string" && typeof v !== "number") continue;
    if (/url|link|uri/.test(lk) && !/icon|thumb|image|img|pic/.test(lk)) entry[k] = MY_URL;
    else if (/name|title|label/.test(lk)) entry[k] = "Stream Zuhause";
    else if (/^(app)?_?id$|appid/.test(lk)) entry[k] = typeof v === "number" ? 990001 : "streamzuhause";
    else if (/icon|thumb|image|img|pic/.test(lk)) entry[k] = MY_URL.replace(/[^\/]*$/, "") + "icon.png";
  }
  list.push(entry);
  var res;
  try { res = hiu("fileWrite", { path: APPINFO, mode: 6, writedata: JSON.stringify(data) }); }
  catch (e) { return info("Schreiben fehlgeschlagen", e.message); }
  info("Installation abgeschickt", "Antwort des TVs: " + String(JSON.stringify(res)).slice(0, 300) +
    "\n\nJetzt den Fernseher einmal komplett neu starten (Netzstecker 10 Sek. ziehen). Danach steht „Stream Zuhause“ am Ende der App-Liste.\n\nNeuer Eintrag: " + JSON.stringify(entry).slice(0, 300));
}
function restoreTile() {
  var b = null; try { b = localStorage.getItem("sz_appinfo_backup"); } catch (e) {}
  if (!b) return info("Keine Sicherung", "Es wurde noch nichts installiert.");
  var res; try { res = hiu("fileWrite", { path: APPINFO, mode: 6, writedata: b }); } catch (e) { return info("Fehler", e.message); }
  info("Wiederhergestellt", "Ursprüngliche App-Liste zurückgeschrieben. Antwort: " + String(JSON.stringify(res)).slice(0, 300));
}

/* =====================================================================
   Detail-Overlay
   ===================================================================== */
function openDetail(item) {
  var app = appByName(item.app);
  document.getElementById("ov-title").innerHTML = esc(item.title);
  document.getElementById("ov-meta").innerHTML = item.noLaunch ? "" : esc(item.info) + " · verfügbar bei " + esc(app.name);
  document.getElementById("ov-text").innerHTML = esc(item.text || "").replace(/\n/g, "<br>");
  var act = document.getElementById("ov-actions"); act.innerHTML = "";
  ovButtons = [];
  if (!item.noLaunch) addBtn("In " + app.name + " öffnen", function () { closeOverlay(); launchApp(app); });
  addBtn("Schließen", closeOverlay);
  function addBtn(label, fn) {
    var b = document.createElement("a"); b.href = "#"; b.className = "btn"; b.innerHTML = esc(label); b._ok = fn;
    b.onclick = function (e) { e.preventDefault(); fn(); return false; };
    act.appendChild(b); ovButtons.push(b);
  }
  ovIdx = 0; mode = "overlay";
  document.getElementById("overlay").style.display = "block";
  renderOverlay();
}
function renderOverlay() {
  for (var i = 0; i < ovButtons.length; i++) ovButtons[i].className = "btn" + (i === ovIdx ? " focus" : "");
}
function closeOverlay() { document.getElementById("overlay").style.display = "none"; mode = "home"; render(); }

/* =====================================================================
   Diagnose
   ===================================================================== */
var keyLog = [], diagM = 0, diagApp = 0;
function openDiag() {
  mode = "diag"; document.getElementById("diag").style.display = "block";
  var found = [], names = [];
  try { names = Object.getOwnPropertyNames(window); } catch (e) {}
  try { for (var p in window) names.push(p); } catch (e) {}
  for (var i = 0; i < names.length; i++) {
    var n = names[i];
    if (/hisense|vidaa|vowos|omi_|hiutils/i.test(n) && found.indexOf(n) < 0) found.push(n);
  }
  found.sort();
  // Interessante Funktionen (alles außer Hisense_Get…) zuerst, mit Quelltext-Anfang
  var other = [], gets = 0, src = "";
  found.forEach(function (f) { if (/^Hisense_Get/i.test(f)) gets++; else other.push(f); });
  other.forEach(function (f) {
    if (/launch|start|open|app|install|request|key|url|browser/i.test(f) && typeof window[f] === "function")
      src += "<br><b>" + esc(f) + ":</b> " + esc(String(window[f]).replace(/\s+/g, " ").slice(0, 160));
  });
  document.getElementById("diag-api").innerHTML =
    "<b>TV-Schnittstellen: " + found.length + " (davon " + gets + "× Hisense_Get…)</b><br>" +
    "<span class='ok'>" + esc(other.join(", ") || "–") + "</span>" +
    src + "<br><br><b>Browser:</b> " + esc(navigator.userAgent) +
    "<br><b>Fenster:</b> " + window.innerWidth + " × " + window.innerHeight;
  var cur = getMethod();
  for (var j = 0; j < METHODS.length; j++) if (METHODS[j].key === cur) diagM = j;
  renderDiag(); renderKeyLog();
}
function renderDiag() {
  var cur = getMethod(), h = "";
  for (var i = 0; i < METHODS.length; i++) {
    var m = METHODS[i], avail = !m.fn || typeof window[m.fn] === "function";
    h += "<span class='btn" + (i === diagM ? " focus" : "") + (m.key === cur ? " cur" : "") + "'>" +
         esc(m.label) + (avail ? "" : " ✗") + "</span>";
  }
  document.getElementById("diag-methods").innerHTML = h +
    "<div id='diag-testapp'>Test-App: <b>" + esc(APPS[diagApp].name) + "</b> (ID " + APPS[diagApp].id + ") · " +
    "gespeichert: <b>" + esc(cur) + "</b> · ✗ = auf diesem TV nicht vorhanden</div>";
}
function closeDiag() { document.getElementById("diag").style.display = "none"; mode = "home"; render(); }
function renderKeyLog() {
  document.getElementById("diag-keys").innerHTML = "<b>Tasten (neueste oben):</b><br>" + keyLog.slice(0, 24).join("<br>");
}
var lastBackInDiag = 0;

/* =====================================================================
   Tastatur-Handling
   - capture-Phase auf window: kommt vor jeder Browser-Standardaktion
   - preventDefault: verhindert, dass der TV-Browser Links/Rechts selbst verwendet
   - keyup als Rückfall, falls ein Modell kein keydown sendet
   ===================================================================== */
var downSeen = {}, lastHandled = 0;
function handleKey(e, type) {
  var act = keyAction(e);
  var desc = type + " keyCode=" + (e.keyCode || e.which || 0) + " key=" + (e.key || "-") + (act ? " → " + act : "");
  var kb = document.getElementById("keybadge"); kb.innerHTML = esc(desc);
  if (mode === "diag") { keyLog.unshift(esc(desc)); renderKeyLog(); }
  if (!act) return;

  var code = e.keyCode || e.key;
  if (type === "keydown") downSeen[code] = true;
  if (type === "keyup") { if (downSeen[code]) { downSeen[code] = false; stop(e); return; } }
  stop(e);

  var now = Date.now(); // gleiche Taste doppelt innerhalb 40 ms (manche Modelle senden doppelt) ignorieren
  if (act === handleKey._last && now - lastHandled < 40) return;
  handleKey._last = act; lastHandled = now;

  if (mode === "diag") {
    if (act === "DIAG") return closeDiag();
    if (act === "BACK") { if (now - lastBackInDiag < 1500) return closeDiag(); lastBackInDiag = now; return; }
    if (act === "LEFT" && diagM > 0) diagM--;
    else if (act === "RIGHT" && diagM < METHODS.length - 1) diagM++;
    else if (act === "UP") diagApp = (diagApp + APPS.length - 1) % APPS.length;
    else if (act === "DOWN") diagApp = (diagApp + 1) % APPS.length;
    else if (act === "OK") { setMethod(METHODS[diagM].key); renderDiag(); renderKeyLog();
      return launchApp(APPS[diagApp], METHODS[diagM].key); }
    renderDiag(); renderKeyLog();
    return;
  }
  if (mode === "overlay") {
    if (act === "LEFT" && ovIdx > 0) ovIdx--;
    else if (act === "RIGHT" && ovIdx < ovButtons.length - 1) ovIdx++;
    else if (act === "OK") return ovButtons[ovIdx]._ok();
    else if (act === "BACK") return closeOverlay();
    return renderOverlay();
  }
  if (act === "OK") { var row = rows[rowIdx]; return row.items[row.col]._ok(); }
  if (act === "DIAG") return openDiag();
  if (act === "INST") return installTile();
  if (act === "DOWN5") { rowIdx = rows.length - 1; rows[rowIdx].col = 0; return render(); }
  if (act === "BACK") return; // Startseite: Zurück ignorieren
  move(act);
}
function stop(e) { if (e.preventDefault) e.preventDefault(); if (e.stopPropagation) e.stopPropagation(); e.returnValue = false; }
window.addEventListener("keydown", function (e) { handleKey(e, "keydown"); }, true);
window.addEventListener("keyup",   function (e) { handleKey(e, "keyup"); }, true);
// verhindert, dass ein fokussiertes Element den Fokus "verliert" und der Browser übernimmt
document.addEventListener("focusin", function (e) {
  if (mode === "home" && e.target && e.target.className && e.target.className.indexOf("tile") < 0) render();
}, true);

/* =====================================================================
   Hilfsfunktionen
   ===================================================================== */
function toast(msg) { var t = document.getElementById("toast"); t.innerHTML = esc(msg); t.style.display = "block";
  clearTimeout(toast._t); toast._t = setTimeout(function () { t.style.display = "none"; }, 2500); }
function log(m) { keyLog.unshift("<span class='ok'>" + esc(m) + "</span>"); }
function saveState() { try { localStorage.setItem("sz_focus", JSON.stringify({ r: rowIdx, c: rows[rowIdx].col })); } catch (e) {} }
function loadState() { try { var s = JSON.parse(localStorage.getItem("sz_focus") || "null");
  if (s && rows[s.r] && rows[s.r].items[s.c]) { rowIdx = s.r; rows[s.r].col = s.c; } } catch (e) {} }
function fit() { var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
  var st = document.getElementById("stage"); st.style.transform = st.style.webkitTransform = "scale(" + s + ")"; }
function tick() { var d = new Date(), p = function (n) { return (n < 10 ? "0" : "") + n; };
  document.getElementById("clock").innerHTML = p(d.getHours()) + ":" + p(d.getMinutes());
  var tage = ["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
  var mon = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
  document.getElementById("date").innerHTML = tage[d.getDay()] + ", " + d.getDate() + ". " + mon[d.getMonth()]; }

build(); loadState(); fit(); tick(); render();
document.getElementById("hbtn-install").onclick = function (e) { e.preventDefault(); installTile(); return false; };
document.getElementById("hbtn-diag").onclick = function (e) { e.preventDefault(); openDiag(); return false; };
loadMeine(); loadSerien(); loadFilme();
setInterval(function () { if (mode === "home") { loadSerien(); } }, 3 * 3600000);
window.addEventListener("resize", fit);
setInterval(tick, 10000);
</script>
